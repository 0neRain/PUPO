[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pupo"
version = "0.1.0"
description = "PUPO: l'agente AI che fa lo studente e impara solo da quello che gli spieghi"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
pupo = "pupo.cli:main"

[tool.setuptools.packages.find]
include = ["pupo*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
